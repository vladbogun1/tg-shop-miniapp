# ArchUnit settings for backend/src/test/java/com/maxsolch/shop/architecture (docs/ARCHITECTURE-CHECKS.md).

# Frozen violations live next to the tests and are committed. Paths are relative to backend/ (Maven's basedir).
freeze.store.default.path=src/test/resources/archunit_store
# A missing store must fail, not silently freeze whatever the code has now. To create the store for a new rule
# run once with -Darchunit.freeze.store.default.allowStoreCreation=true.
freeze.store.default.allowStoreCreation=false

