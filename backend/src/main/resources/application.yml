spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: tg-shop-v2-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tgshop_v2}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&connectTimeout=3000&socketTimeout=60000
    username: ${DB_USER:tgshop}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Явно, а не по умолчанию: 20 соединений на веб-запросы, планировщик и слушатели REQUIRES_NEW (второе
      # соединение, пока первое ещё не отпущено); укладывается в max_connections MySQL с запасом.
      maximum-pool-size: 20
      minimum-idle: 5
      # Нет соединения за 5 с — быстрая ошибка вместо очереди зависших потоков Tomcat (по умолчанию 30 с).
      connection-timeout: 5000
      # Соединение живёт меньше wait_timeout MySQL и обрывов NAT/докера.
      max-lifetime: 1500000
      # Предупреждение в логе о соединении, не вернувшемся в пул за 30 с (утечка или долгая транзакция).
      leak-detection-threshold: 30000
  jpa:
    # false: the JPA session lives only as long as a transaction of the app layer. Whatever a controller renders
    # must be loaded (fetch join / read model) inside that transaction - a lazy collection read in the web layer
    # fails with LazyInitializationException instead of silently opening a query per row.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        default_batch_fetch_size: 50
  # Тексты, которые бот пишет ПОКУПАТЕЛЮ, — на его языке (i18n/messages_*.properties).
  # Сообщения продавцу остаются русскими литералами в коде.
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  cache:
    type: caffeine
    cache-names: products, productById, catalogSchema, npCities, npWarehouses
    caffeine:
      spec: maximumSize=500,expireAfterWrite=120s
  # Uploads: the Boot defaults are 1MB per file / 10MB per request, which silently rejected any
  # normal phone photo (the nginx gateway already allows 25m). Kept a little under the gateway
  # limit so the rejection happens here, with a proper JSON error.
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

server:
  port: 8080
  # SIGTERM (docker stop, релиз): новые запросы не принимаются, текущие дорабатывают, потом выход.
  # Без этого Tomcat рвал соединения посреди оформления заказа. stop_grace_period в compose — 40 с.
  shutdown: graceful
  # Behind the nginx gateway: honour X-Forwarded-For/Proto so client IPs (rate limiting, logs)
  # and generated URLs are the real ones instead of the proxy's.
  # native = Tomcat's RemoteIpValve: X-Forwarded-For is read right-to-left, skipping trusted proxies
  # (private/loopback addresses = our gateways), and the first untrusted address is the client.
  # "framework" took the LEFT-most entry (or a client-sent "Forwarded: for=") — i.e. whatever the
  # client claimed, which made the per-IP login limit trivially bypassable.
  forward-headers-strategy: native

management:
  info:
    build:
      enabled: true
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, caches, metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Business timezone. Day buckets in analytics used to be cut in UTC, so for a UA shop every
  # order placed between 00:00 and 03:00 local landed in "yesterday".
  timezone: ${APP_TIMEZONE:Europe/Kyiv}
  image-base-url: ${IMAGE_BASE_URL:http://localhost:8082/img}
  webapp-base-url: ${WEBAPP_BASE_URL:}
  admin-base-url: ${ADMIN_BASE_URL:}
  # Public website (site/). Cookies for the bot login, its origin, ISR revalidation webhook.
  site:
    base-url: ${SITE_BASE_URL:}
    # Empty = Secure cookies everywhere except the dev profile (plain-http localhost).
    web-cookie-secure: ${WEB_COOKIE_SECURE:}
    revalidate-url: ${SITE_REVALIDATE_URL:}
    revalidate-secret: ${SITE_REVALIDATE_SECRET:}
  # Web Push for the admin PWA. Empty keys = push off (no errors, the settings screen says so).
  # How to generate the keys: .env.example (VAPID_*).
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:}
  telegram:
    bot-token: ${BOT_TOKEN:}
    bot-username: ${BOT_USERNAME:}
    # false = the bot only SENDS (notifications) and does not poll getUpdates. Set on the temporary
    # second backend of a zero-downtime deploy (infra/deploy/deploy.sh): two pollers on one token
    # make Telegram answer 409 to both and back them off for up to a minute.
    polling: ${TELEGRAM_POLLING:true}
    init-data-ttl-seconds: ${INITDATA_TTL_SECONDS:86400}
    admin-init-data-ttl-seconds: ${ADMIN_INITDATA_TTL_SECONDS:300}
    allow-unsigned-init-data: ${ALLOW_UNSIGNED_INIT_DATA:false}
    notify-chat-id: ${NOTIFY_CHAT_ID:0}
    notify-topic-new: ${NOTIFY_TOPIC_NEW:0}
    notify-topic-processing: ${NOTIFY_TOPIC_PROCESSING:0}
    notify-topic-shipped: ${NOTIFY_TOPIC_SHIPPED:0}
    notify-topic-closed: ${NOTIFY_TOPIC_CLOSED:0}
    notify-topic-rejected: ${NOTIFY_TOPIC_REJECTED:0}
    notify-topic-chat: ${NOTIFY_TOPIC_CHAT:0}
    notify-topic-dispatch: ${NOTIFY_TOPIC_DISPATCH:0}
  security:
    jwt-secret: ${JWT_SECRET:Y2hhbmdlLW1lLWJhc2U2NC0yNTZiaXQtc2VjcmV0LWZvci1qd3Qtc2lnbmluZw==}
    jwt-access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:43200}
    # Admin tokens: 12 h by default, silently re-issued while the panel is in use.
    admin-token-ttl-minutes: ${ADMIN_TOKEN_TTL_MINUTES:720}
    admin-login: ${ADMIN_LOGIN:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-bootstrap-tg-id: ${ADMIN_BOOTSTRAP_TG_ID:1}
    # Admin 2FA (TOTP). Key for the secrets at rest: openssl rand -base64 32 (blank = derived from
    # JWT_SECRET, with a warning). Emergency reset of the bootstrap admin: docs/ADMIN-2FA.md.
    admin-2fa-key: ${ADMIN_2FA_KEY:}
    admin-emergency-reset: ${ADMIN_EMERGENCY_RESET:false}
    admin-auth-rate-limit: ${ADMIN_AUTH_RATE_LIMIT:20}
    admin-trusted-device-days: ${ADMIN_TRUSTED_DEVICE_DAYS:30}
  s3:
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:change_me_minio}
    bucket: ${S3_BUCKET:product-images}
  # Users map in the admin: last IP + approximate place per visitor (V35 visitor_locations).
  # path = offline DB-IP "IP to City Lite" .mmdb (CC BY 4.0), put into the image by backend/Dockerfile.
  # No file there = the map simply has no points; enabled=false stops recording IPs at all.
  geoip:
    enabled: ${GEOIP_ENABLED:true}
    path: ${GEOIP_PATH:/app/geoip/dbip-city-lite.mmdb}
    throttle: ${GEOIP_THROTTLE:PT15M}
  # Online payment via monobank acquiring (docs/MONOBANK-ACQUIRING.md). Empty token = off.
  payment:
    due-hours: ${PAYMENT_DUE_HOURS:24}
    invoice-ttl-minutes: ${PAYMENT_INVOICE_TTL_MINUTES:60}
    reconcile-ms: ${PAYMENT_RECONCILE_MS:120000}
    monobank:
      token: ${MONOBANK_TOKEN:}
      api-url: ${MONOBANK_API_URL:https://api.monobank.ua}
      webhook-url: ${MONOBANK_WEBHOOK_URL:}
  novaposhta:
    api-key: ${NOVAPOSHTA_API_KEY:}
    api-url: ${NOVAPOSHTA_API_URL:https://api.novaposhta.ua/v2.0/json/}
    sync-cron: ${NOVAPOSHTA_SYNC_CRON:0 30 3 * * *}
  # Background auto-translation of new and changed Russian texts into uk/en (docs/CONTENT-I18N.md).
  # Empty DEEPL_API_KEY = off; a free key ends with :fx (500 000 characters a month).
  translations:
    deepl:
      api-key: ${DEEPL_API_KEY:}
    auto:
      enabled: ${TRANSLATIONS_AUTO_ENABLED:true}
  # Built-in AI (docs/AI.md): MiniMax over its Anthropic-compatible API, search SearXNG -> Serper. Empty = off.
  ai:
    month-limit-cents: ${AI_MONTH_LIMIT_CENTS:1000}
    model:
      api-key: ${AI_MINIMAX_KEY:}
      base-url: ${AI_MINIMAX_BASE_URL:https://api.minimax.io/anthropic}
    files:
      # pictures of invoices for the supply reader, kept 7 days (V91); created by the backend, TTL rule: infra/ai-files-bucket.sh
      bucket: ${AI_FILES_BUCKET:ai-files}
    search:
      searxng-url: ${AI_SEARXNG_URL:}
      serper-key: ${AI_SERPER_KEY:}
