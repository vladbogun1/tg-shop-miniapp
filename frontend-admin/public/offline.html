<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1E6">
<title>Нет связи — MAXSOLCH Admin</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light; --bg:#F4F1E6; --surface:#FFFFFF; --line:#141414; --text:#141414; --muted:#5F5B50; --accent:#FF5A2C; }
  :root[data-theme="dark"] { color-scheme: dark; --bg:#26262B; --surface:#34343B; --line:#F4F1E6; --text:#F4F1E6; --muted:#AEACA6; --accent:#FF6A3D; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100dvh; display: grid; place-items: center;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    background-color: var(--bg); color: var(--text);
    font-family: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background-image:
      linear-gradient(color-mix(in srgb, var(--text) 6%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--text) 6%, transparent) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .card { width: 100%; max-width: 380px; background: var(--surface); border: 3px solid var(--line); border-radius: 3px; box-shadow: 6px 6px 0 #141414; padding: 24px; }
  img { width: 56px; height: 56px; display: block; margin-bottom: 18px; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: .02em; }
  p { margin: 0 0 20px; font-size: 15px; line-height: 1.5; color: var(--muted); }
  button {
    width: 100%; min-height: 48px; border: 3px solid var(--line); border-radius: 3px; background: var(--accent); color: #141414;
    font: inherit; font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; cursor: pointer;
    box-shadow: 4px 4px 0 #141414; transition: transform .07s ease, box-shadow .07s ease; touch-action: manipulation;
  }
  button:active { transform: translate(4px, 4px); box-shadow: none; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
<script>
  try { if (localStorage.getItem("admin-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
</script>
</head>
<body>
  <main class="card" role="alert">
    <img src="/icons/icon.svg" alt="" width="56" height="56">
    <h1>Нет связи</h1>
    <p>Админка не может достучаться до сервера. Проверьте интернет — страница обновится сама, как только связь появится.</p>
    <button type="button" onclick="location.reload()">Попробовать снова</button>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
