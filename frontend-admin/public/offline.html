<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<title>Нет связи — ChiSetup Admin</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
  /* ChiSetup v3 (DESIGN-V3 §8), standalone: served from the SW cache with no CSS bundle or fonts. */
  :root { color-scheme: dark; --bg:#0E0E10; --surface:#1A1A1A; --line:rgba(255,255,255,.08); --text:#F4F4F5; --muted:#A1A1AA; --accent:#FF6600; --accent-hi:#FF8533; --accent-ink:#0E0E10; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100dvh; display: grid; place-items: center;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    background-color: var(--bg); color: var(--text);
    font-family: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse 60% 32% at 50% -8%, rgba(255,102,0,.10), transparent 70%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: auto, 48px 48px, 48px 48px;
  }
  /* HUD bracket card: two corners cut, white bracket top-left, orange bottom-right. */
  .card {
    position: relative; width: 100%; max-width: 380px; padding: 28px 24px 24px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    border-top-left-radius: 0; border-bottom-right-radius: 0;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  }
  .card::before, .card::after { content: ""; position: absolute; width: 44px; height: 28px; pointer-events: none; }
  .card::before {
    top: -1px; left: -1px; background: #fff;
    clip-path: polygon(0 100%, 0 12px, 12px 0, 100% 0, 100% 2px, 12.83px 2px, 2px 12.83px, 2px 100%);
  }
  .card::after {
    right: -1px; bottom: -1px; background: var(--accent);
    clip-path: polygon(100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 calc(100% - 2px), calc(100% - 12.83px) calc(100% - 2px), calc(100% - 2px) calc(100% - 12.83px), calc(100% - 2px) 0);
  }
  img { width: 56px; height: 56px; display: block; margin-bottom: 18px; }
  .eyebrow { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; color: #fff; }
  p { margin: 0 0 22px; font-size: 15px; line-height: 1.5; color: var(--muted); }
  button {
    width: 100%; min-height: 48px; border: 0; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; cursor: pointer;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition: transform .12s ease, background-color .12s ease; touch-action: manipulation;
  }
  button:hover { background: var(--accent-hi); }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="card" role="alert">
    <img src="/icons/icon.svg" alt="" width="56" height="56">
    <div class="eyebrow">ChiSetup Admin</div>
    <h1>Нет связи</h1>
    <p>Админка не может достучаться до сервера. Проверьте интернет — страница обновится сама, как только связь появится.</p>
    <button type="button" onclick="location.reload()">Попробовать снова</button>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
