# ==========================================================
#  Production TLS overlay for the server (132.145.132.80).
#  Since v3.1.0 the public addresses are subdomains served by the HOST's edge Caddy
#  (~/edge on the server, 80/443), which reaches the gateways over the maxsolch-v2_tgshop network:
#     https://chisetup.com.ua        -> gateway-site
#     https://app.chisetup.com.ua    -> gateway (customer Mini App)
#     https://admin.chisetup.com.ua  -> gateway-admin
#  The `caddy` service below now only serves the OLD https://maxsolkh.shop:666 / :667
#  as permanent redirects to app./admin. (infra/Caddyfile.prod).
#
#  This overlay also pins backend + both frontends to PRE-BUILT registry images
#  (built/pushed by .github/workflows/publish.yml) so the server only PULLS,
#  never builds (disk is tight). Set IMAGE_TAG in .env (first deploy: a version
#  like v2.0.0; later: latest).
#
#  Run layered on top of base + public (pull, don't build):
#    docker compose -f docker-compose.yml -f docker-compose.public.yml -f docker-compose.prod.yml pull
#    docker compose -f docker-compose.yml -f docker-compose.public.yml -f docker-compose.prod.yml \
#                   up -d --no-build \
#                   mysql minio imgproxy nginx backend \
#                   frontend-public gateway frontend-admin-public gateway-admin caddy
#
#  PROD_CERT_DIR must point at the certbot-managed maxsolkh.shop certs (live/maxsolkh.shop/…),
#  used only by the legacy :666/:667 redirects in `caddy`.
# ==========================================================

services:
  # Image-cache nginx is internal-only in prod (gateway proxies /img -> nginx:80).
  # Drop the host publish (8082 is taken by portainer on the server).
  nginx:
    ports: !override []

  # SECURITY: the base compose publishes MySQL on 3341 for local tooling. On a
  # public server that is an internet-reachable database — keep it internal-only.
  mysql:
    ports: !override []

  # SECURITY: same for MinIO — the S3 API (9002) and, worse, the admin console
  # (9003) must never be reachable from the internet. imgproxy/backend talk to
  # it over the compose network as http://minio:9000.
  minio:
    ports: !override []

  # SECURITY: the public overlay publishes the single-origin gateways on 8090/8091 so a local
  # tunnel (cloudflared/ngrok) can reach them. On the server that made the entire API and the
  # admin panel answer over PLAIN HTTP at http://<host>:8090 / :8091, straight past Caddy and TLS —
  # an admin password typed there would travel in cleartext. Caddy talks to them over the compose
  # network (reverse_proxy gateway:80), so binding to loopback loses nothing and still lets a
  # tunnel running ON the server connect.
  gateway:
    ports: !override
      - "127.0.0.1:8090:80"

  gateway-admin:
    ports: !override
      - "127.0.0.1:8091:80"

  # Public website gateway: loopback only; the host's edge Caddy (80/443) serves
  # https://chisetup.com.ua and reaches it over the compose network.
  gateway-site:
    ports: !override
      - "127.0.0.1:8092:80"

  # Pin to pre-built registry images (override the build: from base/public).
  backend:
    image: ${DOCKERHUB_USERNAME:-vladbogun1}/maxsolch2-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      # NOT "dev": the startup check refuses to boot with ALLOW_UNSIGNED_INIT_DATA=true or
      # placeholder secrets outside the dev profile. That is the point.
      SPRING_PROFILES_ACTIVE: prod
      # Shown in the admin «Настройки → Система» block.
      APP_VERSION: ${IMAGE_TAG:-latest}
    # Internal-only in prod (gateways reach it as backend:8080; host 8080 is taken).
    ports: !override []

  frontend-public:
    image: ${DOCKERHUB_USERNAME:-vladbogun1}/maxsolch2-frontend:${IMAGE_TAG:-latest}
    pull_policy: always

  frontend-admin-public:
    image: ${DOCKERHUB_USERNAME:-vladbogun1}/maxsolch2-admin:${IMAGE_TAG:-latest}
    pull_policy: always

  site-public:
    image: ${DOCKERHUB_USERNAME:-vladbogun1}/maxsolch2-site:${IMAGE_TAG:-latest}
    pull_policy: always

  caddy:
    image: caddy:2.8
    container_name: tgshop_v2_caddy
    restart: unless-stopped
    depends_on:
      - gateway
      - gateway-admin
    ports:
      - "666:666"
      - "667:667"
    volumes:
      - ./infra/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ${PROD_CERT_DIR:-/home/ubuntu/TELEGRAM_BOTS/maxsolch-mini-app/caddy/letsencrypt}:/certs:ro
      - tgshop_v2_caddy_data:/data
      - tgshop_v2_caddy_config:/config
    networks:
      - tgshop

volumes:
  tgshop_v2_caddy_data:
  tgshop_v2_caddy_config:
