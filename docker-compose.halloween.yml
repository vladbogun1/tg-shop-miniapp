# ==========================================================
#  Halloween 2026 event (pumpkins + stream draw) — OPT-IN overlay, removable.
#  Up:     docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.halloween.yml up -d --build halloween
#  Down:   docker compose ... rm -sf halloween && docker volume rm <project>_halloween_data
#  The gateways proxy /hw/ to it; without the container /hw/ just answers 502 and the widget stays hidden.
#  Needs in .env: JWT_SECRET (already there), HW_DB_USER / HW_DB_PASSWORD (read-only MySQL user,
#  see events/halloween/README.md), optional HW_* knobs from events/halloween/server/src/config.js.
# ==========================================================
services:
  halloween:
    build:
      context: ./events/halloween
    image: tgshop-v2-halloween:local
    container_name: tgshop_v2_halloween
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      HW_DB_HOST: mysql
      HW_DB_NAME: ${DB_NAME}
      HW_DB_USER: ${HW_DB_USER:-}
      HW_DB_PASSWORD: ${HW_DB_PASSWORD:-}
      HW_BACKEND_URL: http://backend:8080
      HW_STARTS_AT: ${HW_STARTS_AT:-}
      HW_ENDS_AT: ${HW_ENDS_AT:-}
      HW_ORDERS_FROM: ${HW_ORDERS_FROM:-}
      HW_ORDERS_TO: ${HW_ORDERS_TO:-}
      HW_STREAM_AT: ${HW_STREAM_AT:-}
      HW_STREAMS: ${HW_STREAMS:-}
      HW_GOAL: ${HW_GOAL:-}
      HW_DAILY_CAP: ${HW_DAILY_CAP:-}
      HW_FULL_WEIGHT: ${HW_FULL_WEIGHT:-}
      HW_PARTIAL_SHARE: ${HW_PARTIAL_SHARE:-}
      HW_MIN_SPEND_UAH: ${HW_MIN_SPEND_UAH:-}
      HW_MAX_ORDER_TICKETS: ${HW_MAX_ORDER_TICKETS:-}
      HW_ROUNDS_PUMPKINS: ${HW_ROUNDS_PUMPKINS:-}
      HW_ROUNDS_ORDERS: ${HW_ROUNDS_ORDERS:-}
      # bot DMs "you are in the draw": the shop bot token (send only); off unless HW_NOTIFY=1
      HW_BOT_TOKEN: ${BOT_TOKEN:-}
      HW_NOTIFY: ${HW_NOTIFY:-0}
      HW_NOTIFY_ONLY: ${HW_NOTIFY_ONLY:-}
      HW_EXCLUDE_IDS: ${HW_EXCLUDE_IDS:-9000000000000001}
      # 30.10: earlier customers + the broadcast from the admin «Розсилка» dialog
      HW_OLD_MIN_SPEND_UAH: ${HW_OLD_MIN_SPEND_UAH:-}
      HW_OLD_TICKETS: ${HW_OLD_TICKETS:-}
      HW_SITE_URL: ${HW_SITE_URL:-}
      HW_APP_URL: ${HW_APP_URL:-}
    volumes:
      - halloween_data:/data
    networks:
      - tgshop

volumes:
  halloween_data:
