# ==========================================================
#  Public (Telegram) release overlay — OPT-IN, isolated.
#  Adds a single-origin gateway + a relative-URL frontend build,
#  so one HTTPS tunnel (ngrok) serves the whole app for testing
#  the Mini App inside @maxsolch_bot.
#
#  Run WITH the base file:
#    docker compose -f docker-compose.yml -f docker-compose.public.yml up -d --build frontend-public gateway
#    ngrok http 8090
#    # put the ngrok https URL into WEBAPP_BASE_URL in .env, then:
#    docker compose up -d backend
#
#  Does NOT touch the standard local services or the future prod (Caddy) setup.
# ==========================================================

services:
  # Customer Mini App built for SAME-ORIGIN (relative) URLs — everything behind one origin.
  frontend-public:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_IMAGE_BASE_URL: "/img"
    image: tgshop-v2-frontend-public:local
    container_name: tgshop_v2_frontend_public
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - tgshop

  gateway:
    image: nginx:alpine
    container_name: tgshop_v2_gateway
    restart: unless-stopped
    depends_on:
      - frontend-public
      - backend
      - imgproxy
      - nginx
    volumes:
      - ./infra/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    networks:
      - tgshop

  # Admin app built for SAME-ORIGIN (relative) URLs — for its own public gateway/tunnel.
  frontend-admin-public:
    build:
      context: .
      dockerfile: frontend-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_IMAGE_BASE_URL: "/img"
    image: tgshop-v2-frontend-admin-public:local
    container_name: tgshop_v2_frontend_admin_public
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - tgshop

  gateway-admin:
    image: nginx:alpine
    container_name: tgshop_v2_gateway_admin
    restart: unless-stopped
    depends_on:
      - frontend-admin-public
      - backend
      - imgproxy
      - nginx
    volumes:
      - ./infra/gateway-admin.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8091:80"
    networks:
      - tgshop

  # Public WEBSITE (site/) behind its own single-origin gateway (infra/gateway-site.conf.template):
  # / -> site-public, /api + /ws -> backend, /img -> image cache. The backend sends ISR
  # revalidation to http://site-public:3000/_site/revalidate (SITE_REVALIDATE_URL).
  site-public:
    build:
      context: .
      dockerfile: site/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_BASE_URL:-https://maxsolkh.shop}
    image: tgshop-v2-site-public:local
    container_name: tgshop_v2_site_public
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      INTERNAL_API_BASE: http://backend:8080
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      SITE_REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:-}
    networks:
      - tgshop

  gateway-site:
    image: nginx:alpine
    container_name: tgshop_v2_gateway_site
    restart: unless-stopped
    depends_on:
      - site-public
      - backend
      - imgproxy
      - nginx
    volumes:
      - ./infra/gateway-site.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      NGINX_ENVSUBST_FILTER: SITE_GATE
      SITE_GATE_CODE: ${SITE_GATE_CODE:-}
    ports:
      - "8092:80"
    networks:
      - tgshop
