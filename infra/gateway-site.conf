# Single-origin gateway for the public WEBSITE (https://chisetup.com.ua; TLS on the host's edge Caddy):
#   /        -> site (Next.js, site-public:3000)
#   /api/    -> backend REST   (HttpOnly cookie auth works because everything is one origin)
#   /ws      -> backend WebSocket (STOMP; the handshake carries the access cookie)
#   /img/    -> imgproxy via the caching nginx
# Used by docker-compose.public.yml (service gateway-site); the Mini App gateway is unaffected.

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Re-resolve upstreams per request (see gateway.conf): a recreated container must not leave
    # the gateway talking to a dead IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # A shop website is never framed (unlike the Mini App, which Telegram frames).
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs|actuator) {
        return 404;
    }

    # The site's service routes (POST /_site/revalidate) are called by the backend over the compose
    # network (http://site-public:3000/_site/revalidate), never from the internet.
    location /_site/ {
        return 404;
    }

    # Admin login (password and Telegram) is served ONLY by the admin gateway. Here it was
    # reachable too — one more door for password guessing, on a domain where the client address
    # depends on the host's edge proxy. The admin panel never calls it through this gateway.
    location /api/auth/admin/ {
        return 404;
    }

    location /api/media {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /api/ {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location /img/ {
        set $up_images nginx;
        proxy_pass http://$up_images:80$request_uri;
        proxy_set_header Host $host;
    }

    # /pay-return (/ru/…, /en/…): monobank sends our payment modal's iframe here after paying
    # (site/app/[locale]/pay-return/route.ts). The ONLY page that may be framed — by this site only:
    # frame-ancestors 'self' and no X-Frame-Options. Any add_header in a location drops ALL the
    # server-level ones, so the rest of them are repeated here.
    location ~ ^/(?:(?:uk|ru|en)/)?pay-return/?$ {
        set $up_site site-public;
        proxy_pass http://$up_site:3000$request_uri;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else -> the website. Next's own caching headers are kept as they are.
    location / {
        set $up_site site-public;
        proxy_pass http://$up_site:3000$request_uri;
        # Next sends the same security headers (site/next.config.ts, kept for `next start` without
        # this gateway); the server-level add_header above is the one copy clients should get.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
