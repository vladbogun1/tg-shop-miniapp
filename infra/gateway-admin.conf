# Single-origin gateway for the ADMIN public release (so the bot's "Открыть в админке"
# button has an HTTPS URL). Same idea as gateway.conf but "/" → the admin app.
#   /        -> frontend-admin-public (relative same-origin build)
#   /api/    -> backend REST
#   /ws      -> backend WebSocket
#   /img/    -> imgproxy via the caching nginx
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Re-resolve upstreams at request time through Docker's embedded DNS.
    # nginx resolves a hostname written literally in proxy_pass ONCE, at startup, and caches the
    # address forever — so recreating a container during a deploy left the gateway talking to a
    # dead IP and every request 502'd until someone restarted it. Referencing the host through a
    # variable forces a lookup per request, which is what makes a rolling deploy safe.
    resolver 127.0.0.11 valid=10s ipv6=off;


    # ── security headers ────────────────────────────────────────────────
    # The admin panel is a plain browser app (the bot's "Открыть в админке"
    # button opens it in a browser, not as a Mini App), so framing it is never
    # legitimate — deny it outright.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Swagger / OpenAPI / Actuator are internal-only (see gateway.conf).
    location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs|actuator) {
        return 404;
    }

    location /api/ {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /ws {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
    location /img/ {
        set $up_images nginx;
        proxy_pass http://$up_images:80$request_uri;
        proxy_set_header Host $host;
    }
    location / {
        set $up_frontend frontend-admin-public;
        proxy_pass http://$up_frontend:3001$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
