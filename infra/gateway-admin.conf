# Single-origin gateway for the ADMIN public release (so the bot's "Открыть в админке"
# button has an HTTPS URL). Same idea as gateway.conf but "/" → the admin app.
#   /        -> frontend-admin-public (relative same-origin build)
#   /api/    -> backend REST
#   /ws      -> backend WebSocket
#   /img/    -> imgproxy via the caching nginx
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
    location /img/ {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
    }
    location ~ ^/(swagger-ui|v3/api-docs|actuator) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://frontend-admin-public:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
