# Single-origin gateway for the ADMIN public release (so the bot's "Открыть в админке"
# button has an HTTPS URL). Same idea as gateway.conf but "/" → the admin app.
#   /        -> frontend-admin-public (relative same-origin build)
#   /api/    -> backend REST
#   /ws      -> backend WebSocket
#   /img/    -> imgproxy via the caching nginx
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Re-resolve upstreams at request time through Docker's embedded DNS.
    # nginx resolves a hostname written literally in proxy_pass ONCE, at startup, and caches the
    # address forever — so recreating a container during a deploy left the gateway talking to a
    # dead IP and every request 502'd until someone restarted it. Referencing the host through a
    # variable forces a lookup per request, which is what makes a rolling deploy safe.
    resolver 127.0.0.11 valid=5s ipv6=off;
    # On the compose network a connect takes <1 ms. A container that just stopped stays in the
    # resolver cache for a few seconds, and a SYN to its dead address is not refused — it hangs
    # (60 s by default). 2 s turns that into a quick "timeout", and proxy_next_upstream tries the
    # other instance (a deploy keeps two, infra/deploy/deploy.sh). Nothing was sent yet, so this
    # is safe for POST too.
    proxy_connect_timeout 2s;


    # ── security headers ────────────────────────────────────────────────
    # The admin panel is a plain browser app (the bot's "Открыть в админке"
    # button opens it in a browser, not as a Mini App), so framing it is never
    # legitimate — deny it outright.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Swagger / OpenAPI / Actuator are internal-only (see gateway.conf).
    location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs|actuator) {
        return 404;
    }

    # Chat attachments: streamed straight through. Default buffering spools the whole response
    # before the first byte reaches the browser, which is the wrong trade for an image someone is
    # waiting to look at. See infra/gateway.conf for the same block on the public side.
    location /api/media {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # «Фото по ссылке»: скачать + вырезать товар (сервис cutout, по одному) + квадрат — дольше 60 с по умолчанию.
    location ~ ^/api/admin/products/[^/]+/photos/import$ {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location /api/ {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /ws {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
    location /img/ {
        set $up_images nginx;
        proxy_pass http://$up_images:80$request_uri;
        proxy_set_header Host $host;
    }
    location / {
        set $up_frontend frontend-admin-public;
        proxy_pass http://$up_frontend:3001$request_uri;
        # During a zero-downtime deploy (infra/deploy/deploy.sh) the old and the new build answer
        # under one name for a few seconds; a page of one build asking the other for its hashed
        # /_next/static chunk gets 404 — try the other instance instead. Outside a deploy there is
        # one address and nothing to retry. POST is never retried once sent (no non_idempotent).
        proxy_next_upstream error timeout http_404;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
