# Single-origin gateway for the public (Telegram) release.
# One HTTPS origin (via ngrok / later Caddy) serves the whole app:
#   /        -> customer Mini App (frontend-public, relative same-origin build)
#   /api/    -> backend REST
#   /ws      -> backend WebSocket (STOMP/SockJS)
#   /img/    -> imgproxy via the caching nginx
# This file is used ONLY by docker-compose.public.yml; it does not affect the
# standard local stack or the future prod (Caddy) setup.

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Re-resolve upstreams at request time through Docker's embedded DNS.
    # nginx resolves a hostname written literally in proxy_pass ONCE, at startup, and caches the
    # address forever — so recreating a container during a deploy left the gateway talking to a
    # dead IP and every request 502'd until someone restarted it. Referencing the host through a
    # variable forces a lookup per request, which is what makes a rolling deploy safe.
    resolver 127.0.0.11 valid=10s ipv6=off;


    # ── security headers ────────────────────────────────────────────────
    # A Telegram Mini App runs inside a Telegram-owned iframe on the web
    # clients, so we must NOT send X-Frame-Options: DENY. CSP frame-ancestors
    # is the precise tool — allow Telegram, nobody else.
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Never expose the API surface map / runtime internals publicly. Swagger,
    # the OpenAPI doc and Actuator are reachable only from inside the compose
    # network (or an SSH tunnel to backend:8080).
    location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs|actuator) {
        return 404;
    }

    # Chat attachments: streamed straight through. With nginx's default buffering the whole
    # response is spooled (to a temp file once it outgrows the buffers) before the first byte
    # reaches the phone, which is exactly the wrong behaviour for a photo the customer is waiting
    # to see. The backend renders a downscaled variant, so these stay small — but they should
    # still start arriving immediately.
    location /api/media {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # API
    location /api/ {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket (chat realtime)
    location /ws {
        set $up_backend backend;
        proxy_pass http://$up_backend:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # Images — reuse the caching nginx (which fronts imgproxy + MinIO)
    location /img/ {
        set $up_images nginx;
        proxy_pass http://$up_images:80$request_uri;
        proxy_set_header Host $host;
    }

    # Everything else -> customer Mini App
    location / {
        set $up_frontend frontend-public;
        proxy_pass http://$up_frontend:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
