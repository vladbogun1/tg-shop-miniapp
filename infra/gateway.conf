# Single-origin gateway for the public (Telegram) release.
# One HTTPS origin (via ngrok / later Caddy) serves the whole app:
#   /        -> customer Mini App (frontend-public, relative same-origin build)
#   /api/    -> backend REST
#   /ws      -> backend WebSocket (STOMP/SockJS)
#   /img/    -> imgproxy via the caching nginx
# This file is used ONLY by docker-compose.public.yml; it does not affect the
# standard local stack or the future prod (Caddy) setup.

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket (chat realtime)
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # Images — reuse the caching nginx (which fronts imgproxy + MinIO)
    location /img/ {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
    }

    # Swagger / actuator / thymeleaf home (handy through the tunnel)
    location ~ ^/(swagger-ui|v3/api-docs|actuator) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else -> customer Mini App
    location / {
        proxy_pass http://frontend-public:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
