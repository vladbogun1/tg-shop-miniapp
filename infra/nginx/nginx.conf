worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Disk cache for processed images. Key is the request URI, so each distinct
    # imgproxy transform/source gets its own cache entry. Long inactive window
    # because image URLs are content-addressed (change the image -> change the URL).
    proxy_cache_path /var/cache/nginx/img
        levels=1:2
        keys_zone=imgcache:50m
        max_size=2g
        inactive=30d
        use_temp_path=off;

    upstream imgproxy {
        # imgproxy listens on :8080 inside its container by default
        server imgproxy:8080;
    }

    server {
        listen 80;
        server_name _;

        # Image pipeline entrypoint: /img/<signature>/<processing>/plain/s3://bucket/key@webp
        # nginx serves from disk cache on a hit; on a miss it asks imgproxy.
        location /img/ {
            proxy_pass http://imgproxy/;

            proxy_cache imgcache;
            proxy_cache_key "$uri";
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            # Strip any upstream cache directives, force long immutable caching downstream.
            proxy_ignore_headers Cache-Control Expires;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
