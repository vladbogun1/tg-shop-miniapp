# Invite bot, deployed from a released image (no build on the server).
# INVITE_BOT_TAG in .env pins the release (e.g. 1.0.0); see README.md for release/rollback.
#
# Keep the service name `app` and container_name as they are: then `docker compose up -d`
# replaces the running container instead of starting a second one. Two pollers with the
# same BOT_TOKEN make Telegram answer 409 Conflict.
services:
  app:
    image: ${DOCKERHUB_USERNAME:-vladbogun1}/maxsolch-invite-bot:${INVITE_BOT_TAG:-latest}
    container_name: telegram-maxsolch-invite-bot
    restart: unless-stopped
    # BOT_TOKEN, BOT_USERNAME, LANDING_IMAGE_URL and the optional INVITE_* overrides.
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Warsaw}
