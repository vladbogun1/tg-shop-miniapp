name: Publish enhanced admin image

# Builds ONLY the admin app (./frontend-admin) as an arm64 image under a SEPARATE
# tag (:enhanced) for staging in-progress admin enhancements on prod without
# touching :latest — roll back by pulling :latest again. Backend & customer app
# are unchanged by these enhancements, so only the admin image is rebuilt.
#
# Trigger: push to the enhanced branch touching frontend-admin, or manually.
# Requires secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

on:
  push:
    branches: ["enhanced-product-wizard"]
    paths:
      - "frontend-admin/**"
      - ".github/workflows/publish-enhanced.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag for the admin image"
        required: true
        default: "enhanced"

env:
  ADMIN_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/maxsolch2-admin

jobs:
  publish-enhanced:
    name: Build & push enhanced admin (${{ github.event.inputs.tag || 'enhanced' }})
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push enhanced admin (same-origin)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-admin
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
            NEXT_PUBLIC_IMAGE_BASE_URL=/img
          tags: ${{ env.ADMIN_IMAGE }}:${{ github.event.inputs.tag || 'enhanced' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
