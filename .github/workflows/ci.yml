name: CI

# The invite bot (bots/invite-bot) is a separate app with its own workflow (invite-bot.yml):
# a change that touches only the bot must not run the shop's CI.
on:
  push:
    branches: ["**"]
    paths-ignore: ["bots/**", ".github/workflows/invite-bot.yml"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["bots/**", ".github/workflows/invite-bot.yml"]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 · test + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B -ntp test
      - name: Package (skip tests, already ran)
        run: mvn -B -ntp -DskipTests package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: ignore

  # Unit tests never load the Spring context, so a perfectly compiling wiring mistake (a bean that
  # cannot be autowired) reaches production as a crash loop. This boots the real jar against a real
  # MySQL and waits for /actuator/health, with the same strict profile prod uses.
  backend-boot:
    name: Backend (context boots against MySQL)
    runs-on: ubuntu-latest
    needs: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: tgshop_v2
          MYSQL_USER: tgshop
          MYSQL_PASSWORD: tgshoppw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpw"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        working-directory: backend
        run: mvn -B -ntp -DskipTests package
      - name: Boot and probe
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: tgshop_v2
          DB_USER: tgshop
          DB_PASSWORD: tgshoppw
          # Non-placeholder values: StartupSecurityCheck refuses to boot without them.
          JWT_SECRET: c29tZS1yZWFsbHktbG9uZy1zZWNyZXQtdmFsdWUtaGVyZQ==
          ADMIN_LOGIN: admin
          ADMIN_PASSWORD: ci-not-a-placeholder
          ALLOW_UNSIGNED_INIT_DATA: "false"
          BOT_TOKEN: ""
          WEBAPP_BASE_URL: https://example.test:666
          ADMIN_BASE_URL: https://example.test:667
        run: |
          java -jar target/app.jar --server.port=8099 > boot.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 40); do
            if curl -sf --max-time 5 http://localhost:8099/actuator/health | grep -q '"status":"UP"'; then
              echo "context is up"
              kill $APP_PID
              exit 0
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "::error::application exited during startup"
              tail -60 boot.log
              exit 1
            fi
            sleep 5
          done
          echo "::error::application did not become healthy in time"
          tail -60 boot.log
          kill $APP_PID 2>/dev/null || true
          exit 1

  # Integration tests (*IT, backend/src/test/java/.../it): the whole Spring context + Flyway on a real
  # MySQL 8.4 (same service container as backend-boot): stock locks, FIFO lots, after-commit events,
  # merge, returns. Telegram/MinIO are mocked, no network. See docs/INTEGRATION-TESTS.md.
  backend-integration:
    name: Backend (integration tests on MySQL)
    runs-on: ubuntu-latest
    needs: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: tgshop_v2
          MYSQL_USER: tgshop
          MYSQL_PASSWORD: tgshoppw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpw"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Integration tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: tgshop_v2
          DB_USER: tgshop
          DB_PASSWORD: tgshoppw
        run: mvn -B -ntp test-compile failsafe:integration-test failsafe:verify
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: backend/target/failsafe-reports
          if-no-files-found: ignore

  # Admin panel end-to-end (Playwright, e2e/): the jar from the `backend` job against its own MySQL
  # service, a production build of the admin, a seeded fixture (e2e/fixtures/seed.sql). Runs next
  # to backend-boot / frontends, so it adds no time to them. Maven is not needed here — the jar is
  # the `backend` job's artifact (built with its Maven cache). On failure the HTML report, traces,
  # screenshots and the backend log are uploaded.
  e2e-admin:
    name: Admin e2e (Playwright)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-pass
          MYSQL_DATABASE: tgshop_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-db-pass
        ports:
          - 33307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pe2e-root-pass"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # e2e/scripts/run.mjs: use the service DB above and the downloaded jar (no docker, no mvn).
      E2E_EXTERNAL_DB: "1"
      E2E_BACKEND_JAR: ${{ github.workspace }}/backend/target/app.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system deps (browser from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium
      - name: Run admin e2e
        run: npm run e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-admin-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/logs
          retention-days: 14
          if-no-files-found: ignore

  # Customer e2e (docs/ARCHITECTURE-FRONT.md, step 5.0): characterization smokes of the Mini App and the website
  # on the same isolated stack as the admin e2e (+ a fake monobank, nothing is paid): WebKit iPhone + desktop
  # Chromium. Production builds of copies of frontend/ and site/ are made by e2e/scripts/run.mjs --suite=customer.
  e2e-customer:
    name: Customer e2e (Playwright)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-pass
          MYSQL_DATABASE: tgshop_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-db-pass
        ports:
          - 33307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pe2e-root-pass"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      E2E_EXTERNAL_DB: "1"
      E2E_BACKEND_JAR: ${{ github.workspace }}/backend/target/app.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-customer-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and WebKit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium webkit
      - name: Install system deps (browsers from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium webkit
      - name: Run customer e2e
        run: npm run e2e -- --suite=customer
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-customer-report
          path: |
            e2e/playwright-report-customer
            e2e/test-results-customer
            e2e/logs
          retention-days: 14
          if-no-files-found: ignore

  # Mini App, admin, website and the packages/* are one npm workspace, so a single install covers
  # all of them and every root script (lint / typecheck / test / arch:front / build) runs ALL workspaces
  # (docs/ARCHITECTURE-FRONT.md, 2.7.6). The build needs no backend (ISR on demand).
  frontends:
    name: Frontends (lint · typecheck · test · arch · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Architecture ratchet (docs/ARCHITECTURE-FRONT.md 2.7): invariants, dependency-cruiser, ESLint rule counts.
      # Each prints an "app x rule" summary; growth against known-violations.json / frontend-baseline.txt fails.
      - run: npm run arch:front
      # Типы API генерируются из backend/src/test/resources/openapi/openapi.json (снимок /v3/api-docs, его охраняет
      # OpenApiSnapshotTest): сгенерированное обязано совпадать с закоммиченным (docs/ARCHITECTURE-FRONT.md 2.6).
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- packages/core/src/api
      # Настоящий JSON заказа (golden бэкенда) сходится со схемами OpenAPI (замена check-dto-drift).
      - run: npm run check:golden-schema
      - run: npm run build
      # Both customer apps (Mini App + website): iOS 15.4+ / Chrome 92+. The admin runs on the owner's desktop browser.
      - name: Browser compatibility (iOS 15.4+ / Chrome 92+)
        run: node scripts/check-browser-compat.mjs site frontend
      # First Load JS per route of the Mini App and the website: growth > 3 % over scripts/bundle-baseline.txt fails.
      - name: Bundle budget
        run: npm run check:bundle
