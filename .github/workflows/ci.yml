name: CI

# Запускается на каждый push и PR без paths-ignore: пропущенная проверка не присылает статус, и обязательная
# проверка в branch protection зависала бы (а publish.yml ждёт зелёный CI на коммите тега). Бот
# (bots/invite-bot) имеет свой workflow invite-bot.yml; лишний прогон магазина при правке только бота — дешёвая цена.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
    # labeled/unlabeled: метка `ratchet-growth` меняет результат шага храповика, прогон должен перезапуститься.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Минимум прав: CI только читает код (артефакты и кэш GitHub выдаёт отдельным токеном рантайма).
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 · test + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B -ntp test
      - name: Package (skip tests, already ran)
        run: mvn -B -ntp -DskipTests package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: ignore

  # Unit tests never load the Spring context, so a perfectly compiling wiring mistake (a bean that
  # cannot be autowired) reaches production as a crash loop. This boots the real jar against a real
  # MySQL and waits for /actuator/health, with the same strict profile prod uses.
  backend-boot:
    name: Backend (context boots against MySQL)
    runs-on: ubuntu-latest
    needs: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: tgshop_v2
          MYSQL_USER: tgshop
          MYSQL_PASSWORD: tgshoppw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpw"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        working-directory: backend
        run: mvn -B -ntp -DskipTests package
      - name: Boot and probe
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: tgshop_v2
          DB_USER: tgshop
          DB_PASSWORD: tgshoppw
          # Non-placeholder values: StartupSecurityCheck refuses to boot without them.
          JWT_SECRET: c29tZS1yZWFsbHktbG9uZy1zZWNyZXQtdmFsdWUtaGVyZQ==
          ADMIN_LOGIN: admin
          ADMIN_PASSWORD: ci-not-a-placeholder
          ALLOW_UNSIGNED_INIT_DATA: "false"
          BOT_TOKEN: ""
          WEBAPP_BASE_URL: https://example.test:666
          ADMIN_BASE_URL: https://example.test:667
        run: |
          java -jar target/app.jar --server.port=8099 > boot.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 40); do
            if curl -sf --max-time 5 http://localhost:8099/actuator/health | grep -q '"status":"UP"'; then
              echo "context is up"
              kill $APP_PID
              exit 0
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "::error::application exited during startup"
              tail -60 boot.log
              exit 1
            fi
            sleep 5
          done
          echo "::error::application did not become healthy in time"
          tail -60 boot.log
          kill $APP_PID 2>/dev/null || true
          exit 1

  # Integration tests (*IT, backend/src/test/java/.../it): the whole Spring context + Flyway on a real
  # MySQL 8.4 (same service container as backend-boot): stock locks, FIFO lots, after-commit events,
  # merge, returns. Telegram/MinIO are mocked, no network. See docs/INTEGRATION-TESTS.md.
  backend-integration:
    name: Backend (integration tests on MySQL)
    runs-on: ubuntu-latest
    needs: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: tgshop_v2
          MYSQL_USER: tgshop
          MYSQL_PASSWORD: tgshoppw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpw"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Integration tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: tgshop_v2
          DB_USER: tgshop
          DB_PASSWORD: tgshoppw
        run: mvn -B -ntp test-compile failsafe:integration-test failsafe:verify
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: backend/target/failsafe-reports
          if-no-files-found: ignore

  # Admin panel end-to-end (Playwright, e2e/): the jar from the `backend` job against its own MySQL
  # service, a production build of the admin, a seeded fixture (e2e/fixtures/seed.sql). Runs next
  # to backend-boot / frontends, so it adds no time to them. Maven is not needed here — the jar is
  # the `backend` job's artifact (built with its Maven cache). On failure the HTML report, traces,
  # screenshots and the backend log are uploaded.
  e2e-admin:
    name: Admin e2e (Playwright)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-pass
          MYSQL_DATABASE: tgshop_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-db-pass
        ports:
          - 33307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pe2e-root-pass"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # e2e/scripts/run.mjs: use the service DB above and the downloaded jar (no docker, no mvn).
      E2E_EXTERNAL_DB: "1"
      E2E_BACKEND_JAR: ${{ github.workspace }}/backend/target/app.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system deps (browser from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium
      - name: Run admin e2e
        run: npm run e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-admin-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/logs
          retention-days: 14
          if-no-files-found: ignore

  # Customer e2e (docs/ARCHITECTURE-FRONT.md, step 5.0): characterization smokes of the Mini App and the website
  # on the same isolated stack as the admin e2e (+ a fake monobank, nothing is paid): WebKit iPhone + desktop
  # Chromium. Production builds of copies of frontend/ and site/ are made by e2e/scripts/run.mjs --suite=customer.
  e2e-customer:
    name: Customer e2e (Playwright)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-pass
          MYSQL_DATABASE: tgshop_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-db-pass
        ports:
          - 33307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pe2e-root-pass"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      E2E_EXTERNAL_DB: "1"
      E2E_BACKEND_JAR: ${{ github.workspace }}/backend/target/app.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-customer-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and WebKit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium webkit
      - name: Install system deps (browsers from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium webkit
      - name: Run customer e2e
        run: npm run e2e -- --suite=customer
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-customer-report
          path: |
            e2e/playwright-report-customer
            e2e/test-results-customer
            e2e/logs
          retention-days: 14
          if-no-files-found: ignore

  # Mini App, admin, website and the packages/* are one npm workspace, so a single install covers
  # all of them and every root script (lint / typecheck / test / arch:front / build) runs ALL workspaces
  # (docs/ARCHITECTURE-FRONT.md, 2.7.6). The build needs no backend (ISR on demand).
  frontends:
    name: Frontends (lint · typecheck · test · arch · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Architecture ratchet (docs/ARCHITECTURE-FRONT.md 2.7): invariants, dependency-cruiser, ESLint rule counts.
      # Each prints an "app x rule" summary; growth against known-violations.json / frontend-baseline.txt fails.
      #   Храповик сравнивается с baseline из БАЗОВОЙ ветки PR (а не из этого же коммита): рост baseline в PR — ошибка,
      #   пока у PR нет метки `ratchet-growth` (осознанный рост с причиной в описании).
      - name: Fetch base branch (PR)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Architecture ratchet (front)
        env:
          RATCHET_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          RATCHET_GROWTH_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'ratchet-growth') && '1' || '0' }}
        run: npm run arch:front
      - name: Baselines did not grow (known-violations, ArchUnit v2)
        if: github.event_name == 'pull_request'
        env:
          RATCHET_GROWTH_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'ratchet-growth') && '1' || '0' }}
        run: node scripts/check-baseline-growth.mjs "origin/${{ github.base_ref }}"
      # Типы API генерируются из backend/src/test/resources/openapi/openapi.json (снимок /v3/api-docs, его охраняет
      # OpenApiSnapshotTest): сгенерированное обязано совпадать с закоммиченным (docs/ARCHITECTURE-FRONT.md 2.6).
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- packages/core/src/api
      # Настоящий JSON заказа (golden бэкенда) сходится со схемами OpenAPI (замена check-dto-drift).
      - run: npm run check:golden-schema
      - run: npm run build
      # Both customer apps (Mini App + website): iOS 15.4+ / Chrome 92+. The admin runs on the owner's desktop browser.
      - name: Browser compatibility (iOS 15.4+ / Chrome 92+)
        run: node scripts/check-browser-compat.mjs site frontend
      # First Load JS per route of the Mini App and the website: growth > 3 % over scripts/bundle-baseline.txt fails.
      - name: Bundle budget
        run: npm run check:bundle

  # Dockerfile ломался только при публикации тега (publish.yml). Здесь все четыре образа собираются без push,
  # чтобы сломанная сборка ловилась в PR. amd64 на ubuntu-latest: ловим ошибки Dockerfile, не архитектуры.
  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            file: ./backend/Dockerfile
            build-args: ""
          - image: frontend
            context: .
            file: ./frontend/Dockerfile
            build-args: |
              NEXT_PUBLIC_API_BASE_URL=
              NEXT_PUBLIC_IMAGE_BASE_URL=/img
          - image: admin
            context: .
            file: ./frontend-admin/Dockerfile
            build-args: |
              NEXT_PUBLIC_API_BASE_URL=
              NEXT_PUBLIC_IMAGE_BASE_URL=/img
          - image: site
            context: .
            file: ./site/Dockerfile
            build-args: |
              NEXT_PUBLIC_SITE_URL=https://chisetup.com.ua
              NEXT_PUBLIC_BOT_URL=https://t.me/ChiSetupShop_bot
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,scope=ci-${{ matrix.image }},mode=max

  # Репозиторий публичный: секрет в коде или в коммитах PR виден всем. Сканируем дерево на HEAD и ТОЛЬКО коммиты
  # этого PR/пуша (историю целиком не читаем: старое уже вычищено, переписывать её дальше нельзя). Бинарник gitleaks
  # прибит по версии и sha256 (а не «последняя версия экшена»); исключения — .gitleaks.toml, без значений.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL --max-time 120 -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan working tree (HEAD)
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: Scan commits of this PR / push
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha) || '') }}
        run: |
          if [ -z "$RANGE" ]; then echo "нет диапазона (новая ветка): только дерево"; exit 0; fi
          ./gitleaks git --log-opts="$RANGE" --config .gitleaks.toml --redact --no-banner

  # Зависимости рантайма. Сейчас КРАСНЫЙ (next / postcss / sharp / source-map-js), поэтому пока режим отчёта:
  # continue-on-error, результат — в сводке прогона. Починить обновлением зависимостей и убрать continue-on-error.
  npm-audit:
    name: npm audit (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
