name: Invite bot

# CI/CD for bots/invite-bot — a separate app from the shop (the shop's ci.yml ignores bots/**).
#
#   pull_request touching the bot  -> mvn verify
#   push to master touching the bot -> verify + image :sha-<short> and :edge (:latest untouched)
#   tag invite-bot-v1.2.3          -> verify + image :1.2.3 and :latest
#   tag invite-bot-v1.2.3-rc1      -> verify + image :1.2.3-rc1 only (pre-releases never move :latest)
#
# The server pins a release in .env (INVITE_BOT_TAG=1.2.3), so nothing here deploys by itself.
# Requires repo secrets (already present): DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

on:
  pull_request:
    paths: ["bots/invite-bot/**", ".github/workflows/invite-bot.yml"]
  push:
    branches: [master]
    paths: ["bots/invite-bot/**", ".github/workflows/invite-bot.yml"]
    tags: ["invite-bot-v*"]

concurrency:
  group: invite-bot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/invite-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: bots/invite-bot/pom.xml
      - run: mvn -B -ntp verify

  publish:
    name: Build & push image
    needs: verify
    if: github.event_name == 'push'
    # Native ARM64 runner — server #2 is Oracle Ampere (aarch64).
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/maxsolch-invite-bot
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/invite-bot-v* ]]; then
            VERSION="${GITHUB_REF_NAME#invite-bot-v}"
            case "$VERSION" in
              *-rc*|*-beta*|*-alpha*) TAGS="$IMAGE:$VERSION" ;;
              *)                      TAGS="$IMAGE:$VERSION,$IMAGE:latest" ;;
            esac
          else
            TAGS="$IMAGE:sha-${GITHUB_SHA::7},$IMAGE:edge"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tagging: $TAGS"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./bots/invite-bot
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=invite-bot
          cache-to: type=gha,scope=invite-bot,mode=max
