name: Publish neo images

# Builds the Neo-Brutalism stack (backend + customer + admin) as arm64 images and
# pushes them to Docker Hub under a SEPARATE tag (:neo) — it does NOT touch :latest,
# so a temporary prod swap can be rolled back by simply pulling :latest again.
# Frontends are same-origin (relative URL) to match the gateway prod setup.
#
# Trigger: push to the redesign branch touching backend / frontend-neo /
# frontend-admin-neo, or manually. Requires secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

on:
  push:
    branches: ["redesign-neo-brutalism"]
    paths:
      - "frontend-neo/**"
      - "frontend-admin-neo/**"
      - "backend/**"
      - ".github/workflows/publish-neo.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag for the neo images"
        required: true
        default: "neo"

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/maxsolch2-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/maxsolch2-frontend
  ADMIN_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/maxsolch2-admin

jobs:
  publish-neo:
    name: Build & push neo customer image (${{ github.event.inputs.tag || 'neo' }})
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push neo backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.event.inputs.tag || 'neo' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push neo customer frontend (same-origin)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-neo
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
            NEXT_PUBLIC_IMAGE_BASE_URL=/img
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.event.inputs.tag || 'neo' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push neo admin frontend (same-origin)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-admin-neo
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
            NEXT_PUBLIC_IMAGE_BASE_URL=/img
          tags: ${{ env.ADMIN_IMAGE }}:${{ github.event.inputs.tag || 'neo' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
