# tg-shop-v2 — self-hosted Docker stack (single Linux server, no cloud services)
# Image pipeline: browser -> nginx (disk cache) -> imgproxy (resize/WebP/AVIF) -> minio (originals)
# All config comes from the .env file (see .env.example).

services:
  mysql:
    image: mysql:8.4
    container_name: tgshop_v2_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=512M
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3341:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tgshop

  minio:
    image: minio/minio
    # The minio/minio and minio/mc images are no longer published (neither on Docker Hub nor on
    # quay.io): a pull would fail and take the whole `docker compose pull` down with it. Use the
    # image already present on the host and never try to refresh it. See docs/DEPLOY-SERVER.md §6
    # for pinning it / moving to a mirror.
    pull_policy: missing
    container_name: tgshop_v2_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tgshop

  # One-shot job: wait for MinIO and create the bucket. The bucket stays PRIVATE:
  # imgproxy reads originals with the S3 credentials, and chat attachments (customers'
  # photos and files) are served only through the backend's signed /api/media links.
  # It used to be public-read, which made every uploaded file world-readable forever.
  minio-init:
    image: minio/mc
    pull_policy: missing
    container_name: tgshop_v2_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
        echo "MinIO bucket '$${S3_BUCKET}' ready (private)."
    networks:
      - tgshop

  imgproxy:
    image: darthsim/imgproxy
    container_name: tgshop_v2_imgproxy
    restart: unless-stopped
    depends_on:
      - minio
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      # Only PRODUCT images may be proxied. Without a restriction an unsigned imgproxy is an open
      # image proxy (arbitrary URLs, internal addresses). And it must be products/ only, not the
      # whole bucket: chat/ holds customers' photos and files, which are private (signed,
      # expiring /api/media links) — with "s3://bucket/" anyone holding one such link's key could
      # fetch the file through /img/ forever, unsigned and cached for 30 days. imgproxy matches
      # this as a prefix. After changing it, clear the nginx /img cache (see DEPLOY-SERVER.md §6).
      IMGPROXY_ALLOWED_SOURCES: "s3://${S3_BUCKET}/products/"
      # Refuse absurd source images instead of trying to decode them.
      IMGPROXY_MAX_SRC_RESOLUTION: "30"
      IMGPROXY_DOWNLOAD_TIMEOUT: "10"
    # internal only — no host port; reachable as http://imgproxy:8080 inside the network
    networks:
      - tgshop

  nginx:
    image: nginx:alpine
    container_name: tgshop_v2_nginx
    restart: unless-stopped
    depends_on:
      - imgproxy
    ports:
      - "8082:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx/img
    networks:
      - tgshop

  backend:
    build:
      context: ./backend
    container_name: tgshop_v2_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      # Local stack runs as "dev": StartupSecurityCheck only tolerates ALLOW_UNSIGNED_INIT_DATA
      # and placeholder secrets under this profile. docker-compose.prod.yml overrides it.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Kyiv}
      # DB
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES}
      ADMIN_TOKEN_TTL_MINUTES: ${ADMIN_TOKEN_TTL_MINUTES:-720}
      # Admin browser login
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_BOOTSTRAP_TG_ID: ${ADMIN_BOOTSTRAP_TG_ID}
      # Admin 2FA: key for the TOTP secrets at rest; one-shot emergency reset (docs/ADMIN-2FA.md)
      ADMIN_2FA_KEY: ${ADMIN_2FA_KEY:-}
      ADMIN_EMERGENCY_RESET: ${ADMIN_EMERGENCY_RESET:-false}
      ADMIN_AUTH_RATE_LIMIT: ${ADMIN_AUTH_RATE_LIMIT:-20}
      ADMIN_TRUSTED_DEVICE_DAYS: ${ADMIN_TRUSTED_DEVICE_DAYS:-30}
      ADMIN_INITDATA_TTL_SECONDS: ${ADMIN_INITDATA_TTL_SECONDS:-300}
      # Telegram bot
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      INITDATA_TTL_SECONDS: ${INITDATA_TTL_SECONDS}
      ALLOW_UNSIGNED_INIT_DATA: ${ALLOW_UNSIGNED_INIT_DATA}
      # Telegram notify channels
      NOTIFY_CHAT_ID: ${NOTIFY_CHAT_ID}
      NOTIFY_TOPIC_NEW: ${NOTIFY_TOPIC_NEW}
      NOTIFY_TOPIC_PROCESSING: ${NOTIFY_TOPIC_PROCESSING}
      NOTIFY_TOPIC_SHIPPED: ${NOTIFY_TOPIC_SHIPPED}
      NOTIFY_TOPIC_CLOSED: ${NOTIFY_TOPIC_CLOSED}
      NOTIFY_TOPIC_REJECTED: ${NOTIFY_TOPIC_REJECTED}
      NOTIFY_TOPIC_CHAT: ${NOTIFY_TOPIC_CHAT}
      NOTIFY_TOPIC_DISPATCH: ${NOTIFY_TOPIC_DISPATCH}
      # S3 / MinIO
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      # Images
      IMAGE_BASE_URL: ${IMAGE_BASE_URL}
      # URLs
      WEBAPP_BASE_URL: ${WEBAPP_BASE_URL}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      # Public site (site/): its origin, auth-cookie Secure flag (empty = true outside dev),
      # ISR revalidation webhook called after product/tag edits (empty URL = off).
      SITE_BASE_URL: ${SITE_BASE_URL:-}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-}
      SITE_REVALIDATE_URL: ${SITE_REVALIDATE_URL:-}
      SITE_REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:-}
      # Web Push for the admin PWA (empty = off). See .env.example for generating the keys.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Online payment via monobank acquiring (docs/MONOBANK-ACQUIRING.md). Empty token = off.
      # Numbers and the API URL carry real defaults: an empty value would override Spring's own.
      MONOBANK_TOKEN: ${MONOBANK_TOKEN:-}
      MONOBANK_WEBHOOK_URL: ${MONOBANK_WEBHOOK_URL:-}
      MONOBANK_API_URL: ${MONOBANK_API_URL:-https://api.monobank.ua}
      PAYMENT_DUE_HOURS: ${PAYMENT_DUE_HOURS:-24}
      PAYMENT_INVOICE_TTL_MINUTES: ${PAYMENT_INVOICE_TTL_MINUTES:-60}
    ports:
      - "8080:8080"
    networks:
      - tgshop

  # NOTE: NEXT_PUBLIC_* are inlined into the client bundle at BUILD time, so they
  # must be passed as build args — an `environment:` block here would be a no-op
  # and the image would silently keep the Dockerfile's localhost defaults.
  # Changing them in .env therefore requires a rebuild (`up -d --build frontend`).
  frontend:
    build:
      # Repo root: the Next apps are npm workspaces that depend on ./shared.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_IMAGE_BASE_URL: ${NEXT_PUBLIC_IMAGE_BASE_URL}
    container_name: tgshop_v2_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - tgshop

  frontend-admin:
    build:
      context: .
      dockerfile: frontend-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_IMAGE_BASE_URL: ${NEXT_PUBLIC_IMAGE_BASE_URL}
    container_name: tgshop_v2_frontend_admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3001"
    networks:
      - tgshop

  # Public website (site/). Same-origin in the browser: talks to the backend at runtime over
  # INTERNAL_API_BASE; no NEXT_PUBLIC API URLs to bake in. Local port 3007 (3006 is `npm run dev -w site`).
  site:
    build:
      context: .
      dockerfile: site/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_BASE_URL:-http://localhost:3006}
    container_name: tgshop_v2_site
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      INTERNAL_API_BASE: http://backend:8080
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      SITE_REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:-}
    ports:
      - "3007:3000"
    networks:
      - tgshop

volumes:
  mysql_data:
  minio_data:
  nginx_cache:

networks:
  tgshop:
    driver: bridge
